# 学位论文（GB/T 7713.1-2025 + 高校通行版式）
# ---------------------------------------------------------------
# 适用：本科毕业论文、硕士学位论文、博士学位论文。
#
# 依据：GB/T 7713.1-2025《信息与文献 编写规则 第 1 部分：学位论文》
#       （2026-02-01 实施，代替 GB/T 7713.1-2006）、GB/T 7713.2-2022
#       《学术论文编写规则》、GB/T 7714-2025《信息与文献 参考文献著录规则》
#       （2026-07-01 实施，代替 GB/T 7714-2015）。版式参数取高校通行做法
#       （清华 / 北大 / 复旦 / 浙大 / 上交 / 国科大六校要求的公共交集），
#       具体以本校研究生院当年度文件为准。
#
# 与 default 的差异：章节编号用「第1章 / 1.1 / 1.1.1」（chapter 体系）、
# 正文首行缩进 2 字符不变、行距放宽到 1.5 倍、一级标题居中、表格三线表。
# ---------------------------------------------------------------

version: "1.0.0"
profile:
  name: thesis
  title: 学位论文
  standard: GB/T 7713.1-2025
  source: 学位论文编写规则（2025 版）+ 六校研究生院格式要求公共交集
  note: 封面、原创性声明、页眉章名、罗马数字前置页码需人工按本校模板处理
  # 结构要件：存在性检查（见 verify_article_style 结构门禁）。致谢与附录
  # 各校要求不一，未被列为必备。
  required_sections: [摘要, 关键词, 参考文献]

fonts:
  heading: 黑体
  body: 宋体
  western: Times New Roman

sizes_pt:
  doc_title: 18            # 小二（论文题目）
  h1: 16                   # 三号（章标题，多数高校要求）
  h2: 14                   # 四号（节标题）
  h3: 12                   # 小四（小节标题）
  h4: 12
  h5: 12
  h6: 10.5
  h7: 10.5
  body: 12                 # 小四
  table: 10.5              # 五号（学位论文表格通常比正文小一号）
  footer: 10.5             # 五号页码

spacing:
  line: 1.5                # 学位论文通行 1.5 倍行距（复旦固定 20 磅为个别口径）
  h1_before_after_pt: 24   # 章标题段前段后各 1 行（约 24 磅）
  h2_before_after_pt: 12
  h4_before_after_pt: 6
  h6_before_after_pt: 3
  body_before_after_lines: 0

page:
  size: A4
  width_cm: 21.0
  height_cm: 29.7
  margin_cm: 3.0           # 上下左右 3cm（清华口径，对称页边距）
  margin_top_cm: 3.0
  margin_bottom_cm: 2.5
  margin_left_cm: 3.0
  margin_right_cm: 2.5

alignment:
  title: center
  h1: center               # 章标题居中
  h2: left
  h3: left
  h4: left
  h5: left
  h6: left
  h7: left
  body: justify

indent:
  body_first_line_chars: 2
  list_left: 0
  list_hanging: 0

color:
  text: "000000"

bold:
  headings: true
  headings_western: true
  emphasis: true
  table_header: true

table:
  style: three-line      # 三线表（学术/学位论文标准表形）
  font_size_pt: 10.5
  header_bold: true
  shading: false
  first_line_indent: false
  line_spacing: 1.5
  header_repeat: true
  cant_split: true

footer:
  font: 宋体
  font_size_pt: 10.5
  color: "000000"
  alignment: center
  number_format: plain     # 正文页码用纯阿拉伯数字

list:
  auto_numbering: true
  restart_per_block: true
  indent_zero: true
  space_after_number: true
  first_line_indent: false
  bold: false

navigation:
  heading_styles: true
  outline_levels: [0, 1, 2, 3, 4, 5, 6]
  title_in_toc: false

numbering_scheme:
  heading_levels: 4        # GB/T 7713.2：章节编号一般不超过 4 级
  heading_kind: chapter    # 第1章 / 1.1 / 1.1.1
  heading_auto_number: true
  heading_gap_check: error
  space_after_number: true
