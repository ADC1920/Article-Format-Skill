[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "article-format"
version = "2.2.1"
description = "中文文章排版：Markdown → 符合文体规范的 Word docx（13 种 profile + 规范库）"
# 指向 PACKAGE.md 而非 SKILL.md：SKILL.md 开头是技能 frontmatter（YAML），
# 作为 long_description 会被原样塞进包元数据，发布页显示成键值对乱码。
readme = "PACKAGE.md"
requires-python = ">=3.9"
# 未选用 OSI 许可。setuptools>=77 起只接受 SPDX 表达式字符串，
# 旧写法 license = { text = "..." } 已弃用（2027-02 后失效）。
license = "LicenseRef-Proprietary"

# 版本区间写死的理由：python-docx 1.x 与 0.8.x 的段落/编号 API 有差异，
# PyYAML 6 之前 safe_load 对某些标量的处理也不同。此前完全没有约束，
# 换台机器装到旧版会静默产出不同结果。
dependencies = [
    "python-docx>=1.1,<2",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

# 脚本目录不是包（无 __init__.py），只做可执行入口声明。
# 直接 python scripts/xxx.py 调用即可，无需安装。
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q"
