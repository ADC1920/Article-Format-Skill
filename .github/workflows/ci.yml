name: CI

# 目标用户主要在 Windows + WPS 上，核心路径虽无平台分支，但「大概率没事」
# 和「测过」是两回事。三平台都跑，Windows 是主战场。
on:
  push:
    branches: [main, master]
    paths:
      - "skills/article-format/**"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.9", "3.11", "3.12"]
        exclude:
          # ubuntu-latest 已升到 Ubuntu 26.04，该镜像不提供 Python 3.9
          # （实测 setup-python 报 "version '3.9' was not found"）。
          # 3.9 是 pyproject 声明的最低支持版本，改用 22.04 保留覆盖。
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-22.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # 技能在仓库子目录下，所有命令都在这里跑
        working-directory: skills/article-format
    env:
      # Windows runner 控制台默认 cp1252，脚本与 pytest 输出中文会
      # UnicodeEncodeError。强制 stdout/stderr 走 UTF-8。
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "python-docx>=1.1,<2" "PyYAML>=6.0,<7" "pytest>=8,<9"

      - name: 技能自洽检查（profile/规范库/取值/版本一致性）
        run: python scripts/check_skill_consistency.py

      - name: 单元与端到端测试
        run: python -m pytest tests/ -q

      - name: 13 个 profile 端到端回归
        run: python scripts/run_profile_regression.py
